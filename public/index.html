<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SecondEarth Simulator</title>
<link rel="stylesheet" href="app.css">
</head>
<body>
<header class="bar">
  <b class="brand">SecondEarth Simulator</b>
  <span class="dim" id="runInfo"></span>
  <nav class="tabs">
    <button data-tab="sim" class="on">Simulation</button>
    <button data-tab="people">Personas</button>
    <button data-tab="report">Report</button>
  </nav>
  <a href="new.html" class="dim">New run</a>
  <span class="grow"></span>
  <span id="filters" class="filters">
    <label class="dim">Country <select id="fCountry"><option value="">All</option><option value="KR">Korea</option><option value="US">US</option></select></label>
    <label class="dim">Age <select id="fAge"><option value="">All</option><option value="18-24">18-24</option><option value="25-34">25-34</option><option value="35-44">35-44</option><option value="45-54">45-54</option><option value="55-99">55+</option></select></label>
    <label class="dim">When <select id="fMoment"></select></label>
    <label class="dim">Split <select id="fSplit"><option value="">None</option><option value="creative">Ad</option><option value="country">Country</option><option value="age">Age</option><option value="sector">Sector</option><option value="moment">Moment</option><option value="outcome">Outcome</option></select></label>
  </span>
  <span class="seg"><button id="mPure" class="on">Pure</button><button id="mCal">Calibrated</button></span>
</header>

<main id="sim" class="view">
  <section class="stage" id="stage">
    <div id="cols"></div>
    <canvas id="c"></canvas>
    <div class="timeline">
      <button id="play">Pause</button>
      <button id="speed">1x</button>
      <input id="scrub" type="range" min="0" max="720" step="1" value="0" aria-label="Move through time">
      <b id="clock">D0</b>
      <span id="followBtn" class="follow" hidden>Following: <b id="followName"></b> <button id="stopFollow">Stop</button></span>
      <span class="zoomctl"><button id="zOut" aria-label="Zoom out">−</button><button id="zFit">Fit</button><button id="zIn" aria-label="Zoom in">+</button></span>
    </div>
    <div class="log" id="log"></div>
  </section>
  <aside class="panel" id="panel"></aside>
</main>

<main id="people" class="view scroll" hidden>
  <div class="ppl">
    <div class="pplHead"><h1 id="setName"></h1><p class="dim" id="setNote"></p></div>
    <div class="pplFilters">
      <input id="pQ" placeholder="Search name, job, app, tastes" aria-label="Search">
      <select id="pCountry"><option value="">All countries</option><option value="KR">Korea</option><option value="US">US</option></select>
      <select id="pAge"><option value="">All ages</option><option value="18-24">18-24</option><option value="25-34">25-34</option><option value="35-44">35-44</option><option value="45-54">45-54</option><option value="55-99">55+</option></select>
      <select id="pGender"><option value="">All genders</option><option value="Male">Male</option><option value="Female">Female</option></select>
      <select id="pSector"><option value="">All sectors</option></select>
      <b id="pCount"></b>
    </div>
    <div class="dist" id="dist"></div>
    <div class="tableWrap"><table id="pTable"></table></div>
    <button id="pMore">Load more</button>
  </div>
</main>

<main id="report" class="view scroll" hidden><article class="doc" id="doc"></article></main>

<div class="tip" id="tip" hidden></div>
<div class="zoom" id="zoom" hidden><img alt=""></div>
<div class="sheet" id="sheet" hidden><div class="sheetBody" id="sheetBody"></div></div>
<script src="calc.js"></script>
<script src="life.js"></script>
<script src="app.js"></script>
</body>
</html>
