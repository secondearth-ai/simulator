<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>New simulation · SecondEarth Simulator</title>
<link rel="stylesheet" href="app.css">
<style>
  .wiz { max-width: 860px; margin: 0 auto; padding: 22px 16px 80px; }
  .wiz h1 { font-size: 18px; margin: 0 0 4px; font-weight: 600; }
  .wiz h2 { font-size: 13px; margin: 20px 0 6px; font-weight: 600; }
  .wiz p { margin: 0 0 10px; }
  .crumbs { display: flex; flex-wrap: wrap; gap: 4px; margin-bottom: 20px; }
  .crumbs button { color: var(--dim); background: none; }
  .crumbs button.on { color: #000; background: var(--fg); border-color: var(--fg); }
  .crumbs button:disabled { opacity: .45; cursor: default; }
  .f { display: block; margin-bottom: 12px; }
  .f > span { display: block; color: var(--dim); margin-bottom: 3px; }
  .wiz input[type=text], .wiz input[type=number], .wiz input[type=password], .wiz input[type=url], .wiz textarea, .wiz select { width: 100%; max-width: 100%; }
  .wiz textarea { font: inherit; color: var(--fg); background: var(--bg2); border: 1px solid var(--line); border-radius: 3px; padding: 5px 9px; min-height: 64px; resize: vertical; display: block; }
  .inline { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
  .inline input[type=text], .inline input[type=url] { flex: 1 1 240px; width: auto; }
  .inline input[type=number] { width: 90px; }
  .grid2 { display: grid; grid-template-columns: repeat(auto-fit, minmax(190px, 1fr)); gap: 0 14px; }
  .scr { display: grid; grid-template-columns: 26px 92px minmax(0, 1fr); gap: 10px; padding: 10px 0; border-top: 1px solid var(--line); }
  .scr .no { color: var(--dim); text-align: right; }
  .scr img { width: 92px; height: 176px; object-fit: cover; object-position: top; border: 1px solid var(--line); border-radius: 3px; cursor: zoom-in; display: block; }
  .scr .ctl { display: flex; gap: 4px; margin-top: 6px; }
  .scr .ctl button { padding: 1px 7px; }
  .ads2 { display: grid; grid-template-columns: repeat(auto-fill, minmax(130px, 1fr)); gap: 12px; }
  .ads2 img { width: 100%; aspect-ratio: 9/16; object-fit: cover; border-radius: 3px; border: 1px solid var(--line); display: block; margin-bottom: 4px; }
  .chips { display: flex; flex-wrap: wrap; gap: 4px; max-height: 148px; overflow-y: auto; }
  .chips label { border: 1px solid var(--line); padding: 1px 7px; border-radius: 3px; cursor: pointer; }
  .chips label.on { color: #000; background: var(--fg); border-color: var(--fg); }
  .chips input { position: absolute; opacity: 0; width: 0; height: 0; }
  .box { border: 1px solid var(--line); border-radius: 3px; padding: 10px 12px; margin: 12px 0; background: var(--bg2); }
  .cost { font-variant-numeric: tabular-nums; }
  .cost b { font-size: 15px; font-weight: 600; }
  .nav { display: flex; gap: 8px; justify-content: space-between; margin-top: 22px; padding-top: 14px; border-top: 1px solid var(--line); }
  .err { color: var(--leave); margin: 10px 0 0; min-height: 1.5em; }
  .wait { color: var(--wait); }
  .prog { height: 8px; background: var(--faint); margin: 8px 0; } .prog i { display: block; height: 100%; width: 0; background: var(--install); transition: width .3s; }
  .stepl { list-style: none; padding: 0; margin: 10px 0; }
  .stepl li { padding: 2px 0; color: var(--dim); } .stepl li.now { color: var(--sel); } .stepl li.ok { color: var(--install); }
  .runs a { color: var(--fg); }
  .runs td, .runs th { font-weight: 400; text-align: left; padding: 3px 12px 3px 0; border-bottom: 1px solid var(--line); white-space: nowrap; }
  .runs th { color: var(--dim); }
  .tableScroll { overflow-x: auto; }
  input[type=range] { padding: 0; background: none; border: 0; accent-color: var(--fg); width: 100%; }
  input[type=file] { max-width: 100%; }
  @media (max-width: 560px) { .scr { grid-template-columns: 70px minmax(0, 1fr); } .scr .no { display: none; } .scr img { width: 70px; height: 134px; } }
</style>
</head>
<body>
<header class="bar">
  <a href="/" class="brand" style="color:inherit;text-decoration:none">SecondEarth Simulator</a>
  <span class="dim">New simulation</span>
  <span class="grow"></span>
  <a href="/" class="dim">Results</a>
</header>
<main class="view scroll"><div class="wiz" id="wiz"></div></main>
<div class="zoom" id="zoom" hidden><img alt=""></div>
<script src="new.js"></script>
</body>
</html>
